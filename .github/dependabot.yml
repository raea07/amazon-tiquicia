# Weekly updates for the workspace's packages and for the CI actions, grouped
# so they arrive as a few reviewable pull requests rather than dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      supabase:
        patterns: ["@supabase/*"]
      tooling:
        patterns: ["@biomejs/*", "typescript", "vitest", "turbo", "tailwindcss", "@tailwindcss/*"]
    # The native apps take the versions Expo tested with their SDK. Those move
    # together, on an SDK upgrade done by hand (`pnpm expo install --fix`), not
    # one package at a time. CI's `expo install --check` refuses a stray bump,
    # including a React version the web apps move to.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-async-storage/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: CI

# Every push to main and every pull request gets the same checks a developer
# runs locally: lint, types, unit tests, the database built from scratch with
# its own tests, the API contract tests, production builds of every app, and
# the browser journeys. The native apps get their configuration and versions
# checked, their JavaScript bundles exported for iOS, Android and the web, and
# the native journeys run against the web export. No native binary is built
# here: that is EAS Build, run by hand with the owner's Expo account.

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and nothing here holds a secret: a pull request from a fork runs
# with the same read-only token and no secrets (it is `pull_request`, never
# `pull_request_target`). Actions are pinned to commits, not tags, so a moved
# tag cannot change what runs; Dependabot proposes the new commit with its
# version in the trailing comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public, local-only values: the stand-in API that the tests and builds talk to.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_development_only
  PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yuntera_local
  NEXT_TELEMETRY_DISABLED: "1"
  # Nothing stands in front of the apps here, so the journeys may say who the
  # visitor is (the sign-in limit per address); see tools/dev/stack.sh.
  AUTH_CLIENT_IP_HEADER: x-forwarded-for
  # These production builds run against the local stand-in: the readable local
  # keys are accepted only with this said explicitly (guard.ts, isLocalRun).
  YUNTERA_LOCAL_RUN: "1"

jobs:
  checks:
    name: Lint, types, tests, database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run the repository's own scripts; none of them needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # The invoice tests validate every document against Hacienda's schemas with xmllint.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Unit tests
        run: pnpm test

      - name: Build the database from scratch
        run: pnpm db:local:reset
      - name: Database tests
        run: pnpm db:local:test
      - name: API contract tests
        run: pnpm --filter @yuntera/db test

  journeys:
    name: Build and browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run the repository's own scripts; none of them needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Database and local API
        run: |
          pnpm db:local:reset
          nohup pnpm --filter @yuntera/dev-api start > dev-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:54321/auth/v1/.well-known/jwks.json > /dev/null && break
            sleep 1
          done

      - name: Build every app
        run: pnpm build

      - name: Start the apps
        run: |
          for app in web seller ops field; do
            nohup pnpm --filter "@yuntera/$app" start > "$app.log" 2>&1 &
          done
          for port in 3000 3001 3002 3003; do
            for attempt in $(seq 1 30); do
              curl -sf -o /dev/null "http://127.0.0.1:$port/ingresar" && break
              sleep 1
            done
          done

      - name: Start the notification and payments workers, the fake providers and the fake gateway
        run: |
          nohup pnpm --filter @yuntera/dev-notify fake > fake-providers.log 2>&1 &
          nohup pnpm --filter @yuntera/dev-notify fake-pay > fake-pay.log 2>&1 &
          nohup pnpm --filter @yuntera/dev-notify functions > functions.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:54323/_fake/messages && \
              curl -sf -o /dev/null http://127.0.0.1:54324/_fake/health && \
              curl -sf -o /dev/null http://127.0.0.1:54322/health && break
            sleep 1
          done

      - name: Start the invoice worker and the fake of Hacienda
        run: |
          nohup pnpm --filter @yuntera/dev-hacienda fake > fake-hacienda.log 2>&1 &
          nohup pnpm --filter @yuntera/dev-hacienda functions > invoicing.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:54325/_fake/documents && \
              curl -sf -o /dev/null http://127.0.0.1:54326/health && break
            sleep 1
          done

      - name: Install the browser
        run: pnpm --filter @yuntera/e2e exec playwright install --with-deps chromium

      - name: Browser journeys
        run: pnpm --filter @yuntera/e2e journeys

      - name: Keep screenshots and logs when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journeys
          path: |
            tools/e2e/screenshots
            *.log
          retention-days: 7

  native:
    name: Native apps (config, bundles, journeys)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Later steps run the repository's own scripts; none of them needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configuration resolves and versions match Expo SDK 58
        run: |
          for app in shop seller driver warehouse; do
            echo "── $app"
            (cd "apps/$app-native" && pnpm exec expo config --type public --json > /dev/null)
            (cd "apps/$app-native" && pnpm exec expo install --check)
          done

      - name: Export the JavaScript bundles for iOS and Android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.invalid
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: |
          for app in shop seller driver warehouse; do
            (cd "apps/$app-native" && pnpm exec expo export --platform ios --platform android --output-dir dist)
          done

      - name: No cipher or hash implementation in the bundles
        run: node packages/expo-kit/scripts/scan-bundles.mjs apps/shop-native/dist apps/seller-native/dist apps/driver-native/dist apps/warehouse-native/dist

      - name: Install the browser
        run: pnpm --filter @yuntera/native-e2e exec playwright install --with-deps chromium

      - name: Web export, served, and the native journeys
        run: |
          tools/dev/stack.sh native 0
          tools/dev/stack.sh native-e2e 0

      - name: Keep screenshots and logs when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native
          path: |
            tools/native-e2e/screenshots
            .lane/0/*.log
          retention-days: 7

<!doctype html>
<html lang="es-CR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Yuntera</title>
  </head>
  <!--
    The frame every Yuntera e-mail shares. supabase/scripts/auth-config.sh puts
    each template's content where the CONTENT marker is and sends the result to
    the hosted project; the local stand-in does the same. Colours are the brand
    tokens (packages/brand/src/tokens.ts): celeste 600 #0b7f8e on white, ink
    anil 900 #161d33, muted anil 600 #3f4e76, page arena 50 #fbfaf7. No images:
    many mail programs block them, and the text must stand on its own.
  -->
  <body style="margin:0;padding:0;background:#fbfaf7;color:#161d33;font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbfaf7;">
      <tr>
        <td align="center" style="padding:24px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 4px 16px 4px;font-size:24px;font-weight:700;letter-spacing:-0.5px;color:#0b7f8e;">
                Yuntera
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border:1px solid #eae5da;border-radius:16px;padding:28px 24px;font-size:16px;line-height:1.55;">
                <!-- CONTENT -->
              </td>
            </tr>
            <tr>
              <td style="padding:16px 4px;font-size:13px;line-height:1.5;color:#3f4e76;">
                Le escribimos porque alguien usó esta dirección en Yuntera. Nunca le pediremos su
                contraseña ni sus códigos por correo, teléfono o WhatsApp.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
